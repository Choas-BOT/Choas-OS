
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Choas OS - Desktop Environment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        
        /* Dark Mode Glass (Default) */
        .glass {
            background: rgba(15, 15, 25, 0.7);
            backdrop-filter: blur(24px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        /* Light Mode Glass */
        .glass-light {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.1);
        }

        .window-shadow {
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.3), 0 0 0 1px rgba(255, 255, 255, 0.05);
        }

        /* Wallpapers */
        .os-bg {
            background: radial-gradient(circle at top left, #2e2a7a 0%, #0c0f2b 100%);
            transition: background 1s ease;
        }
        .os-bg-light {
            background: radial-gradient(circle at top right, #e0e7ff 0%, #f1f5f9 100%);
        }
        .os-bg-vivid {
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #ec4899 100%);
        }
        .neon {
            background: linear-gradient(135deg, #1e1b4b 0%, #312e81 30%, #4338ca 70%, #1e1b4b 100%);
        }
        .solar {
            background: linear-gradient(135deg, #7c2d12 0%, #9a3412 40%, #ea580c 100%);
        }

        .start-menu-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 1rem;
        }

        @keyframes boot-fade {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        @keyframes loading {
          0% { transform: translateX(-100%); }
          50% { transform: translateX(100%); }
          100% { transform: translateX(-100%); }
        }
        .boot-anim {
            animation: boot-fade 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .active-window {
            z-index: 50 !important;
            border-color: rgba(59, 130, 246, 0.5) !important;
        }

        /* Text readability */
        .text-shadow-sm {
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
        }
        .light-theme .text-shadow-sm {
            text-shadow: 0 1px 2px rgba(255,255,255,0.2);
        }

        ::-webkit-scrollbar {
          width: 8px;
        }
        ::-webkit-scrollbar-track {
          background: rgba(0,0,0,0.05);
        }
        ::-webkit-scrollbar-thumb {
          background: rgba(0,0,0,0.1);
          border-radius: 4px;
        }
        .dark-theme ::-webkit-scrollbar-thumb {
          background: rgba(255,255,255,0.1);
        }
    </style>
    <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.sh/@google/genai@^1.39.0",
